{% extends 'base.html' %}
{% block title %}Connexion — RoomBooking{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Connexion</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label"></label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label"></label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
                <hr>
                <p class="text-center mb-0">Pas encore de compte ? <a href="{% url 'accounts:register' %}">S'inscrire</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
