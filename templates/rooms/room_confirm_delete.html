{% extends 'base.html' %}
{% block title %}Supprimer — RoomBooking{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmer la suppression</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="lead">Voulez-vous vraiment supprimer la salle <strong>"{{ object.name }}"</strong> ?</p>
                <p class="text-muted">Cette action est irréversible.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                        <a href="{% url 'rooms:room_list' %}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
